<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Nature Core AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--green:#22c55e;--dark:#020617;--card:#0f172a;--border:#1e293b;--text:#cbd5e1;--muted:#64748b;}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--dark);color:white;min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-bottom:1px solid var(--border);}
.logo{font-size:18px;font-weight:bold;color:var(--green);text-decoration:none;}
.logo span{color:white;}
.back{color:var(--muted);font-size:14px;text-decoration:none;}
.back:hover{color:white;}
.auth-container{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:40px;width:100%;max-width:440px;}
.auth-logo{text-align:center;margin-bottom:32px;}
.auth-logo div{font-size:36px;margin-bottom:8px;}
.auth-logo h1{font-size:22px;font-weight:800;}
.auth-logo h1 span{color:var(--green);}
.auth-logo p{color:var(--muted);font-size:14px;margin-top:4px;}
.tabs{display:flex;background:var(--dark);border-radius:12px;padding:4px;margin-bottom:28px;}
.tab{flex:1;padding:10px;text-align:center;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border:none;background:none;}
.tab.active{background:var(--border);color:white;}
.form-group{margin-bottom:20px;}
.form-group label{display:block;font-size:13px;color:var(--text);margin-bottom:8px;font-weight:500;}
.form-group input{width:100%;padding:14px 16px;background:var(--dark);border:1px solid var(--border);border-radius:12px;color:white;font-size:15px;outline:none;transition:border-color 0.2s;}
.form-group input:focus{border-color:var(--green);}
.form-group input::placeholder{color:var(--muted);}
.terms-check{display:flex;gap:10px;align-items:flex-start;margin-bottom:24px;}
.terms-check input{margin-top:3px;accent-color:var(--green);width:16px;height:16px;flex-shrink:0;}
.terms-check label{font-size:13px;color:var(--muted);line-height:1.5;}
.terms-check a{color:var(--green);text-decoration:none;}
.btn-main{width:100%;padding:15px;background:var(--green);color:#000;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:16px;transition:opacity 0.2s;}
.btn-main:hover{opacity:0.9;}
.btn-main:disabled{opacity:0.5;cursor:not-allowed;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider hr{flex:1;border:none;border-top:1px solid var(--border);}
.divider span{color:var(--muted);font-size:13px;}
.btn-google{width:100%;padding:13px;background:transparent;color:white;border:1px solid var(--border);border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-google:hover{border-color:var(--green);}
.alert{padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:20px;display:none;}
.alert.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;}
.alert.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#86efac;}
.forgot{text-align:right;margin-top:-12px;margin-bottom:20px;}
.forgot a{color:var(--green);font-size:13px;text-decoration:none;}
.password-wrap{position:relative;}
.password-wrap input{padding-right:48px;}
.toggle-pw{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;}
#signupForm{display:none;}
footer{text-align:center;padding:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--border);}
footer a{color:var(--green);text-decoration:none;}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NatureCore AI">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<nav>
  <a href="index.html" class="logo">Nature<span>Core</span> AI</a>
  <a href="index.html" class="back">← Back to home</a>
</nav>

<div class="auth-container">
  <div class="auth-box">
    <div class="auth-logo">
      <div>🌿</div>
      <h1>Nature<span>Core</span> AI</h1>
      <p>The World's Most Intelligent Natural Medicine Platform</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign In</button>
      <button class="tab" onclick="switchTab('signup')">Create Account</button>
    </div>

    <div class="alert error" id="alertBox"></div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" id="loginPassword" placeholder="Your password" onkeypress="if(event.key==='Enter')login()">
          <button class="toggle-pw" onclick="togglePw('loginPassword')">👁</button>
        </div>
      </div>
      <div class="forgot"><a href="#" onclick="forgotPassword()">Forgot password?</a></div>
      <button class="btn-main" id="loginBtn" onclick="login()">Sign In</button>
      <div class="divider"><hr><span>or</span><hr></div>
      <button class="btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" id="signupPassword" placeholder="Min 8 characters" onkeypress="if(event.key==='Enter')signup()">
          <button class="toggle-pw" onclick="togglePw('signupPassword')">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label>Country</label>
        <input type="text" id="signupCountry" placeholder="e.g. Nigeria, Ghana, Kenya...">
      </div>
      <div class="form-group">
        <label>Preferred Language</label>
        <select id="signupLang" style="width:100%;padding:14px 16px;background:var(--dark);border:1px solid var(--border);border-radius:12px;color:white;font-size:15px;outline:none;">
          <option value="english">English (Default)</option>
          <option value="yoruba">Yoruba</option>
          <option value="hausa">Hausa</option>
          <option value="igbo">Igbo</option>
          <option value="pidgin">Nigerian Pidgin</option>
          <option value="french">French</option>
          <option value="arabic">Arabic</option>
          <option value="swahili">Swahili</option>
          <option value="portuguese">Portuguese</option>
          <option value="spanish">Spanish</option>
          <option value="hindi">Hindi</option>
        </select>
      </div>
      <div class="terms-check">
        <input type="checkbox" id="termsCheck">
        <label for="termsCheck">I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a> of Nature Core AI</label>
      </div>
      <button class="btn-main" id="signupBtn" onclick="signup()">Create Free Account</button>
      <div class="divider"><hr><span>or</span><hr></div>
      <button class="btn-google" onclick="googleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Nature Core AI &nbsp;·&nbsp; <a href="terms.html">Terms</a> &nbsp;·&nbsp; <a href="privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="index.html">Home</a></p>
</footer>
<script>
const SUPABASE_URL = "https://kwuutumzvdcsmbioqhbh.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3dXV0dW16dmRjc21iaW9xaGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NTAzOTEsImV4cCI6MjA5NTMyNjM5MX0.7_Eatvd75ez4kGv745Fd7bF6pyKMp1LYl-hNPvierbA";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

function switchTab(tab){
  document.getElementById("loginForm").style.display = tab==="login" ? "block" : "none";
  document.getElementById("signupForm").style.display = tab==="signup" ? "block" : "none";
  document.querySelectorAll(".tab").forEach((t,i)=>{
    t.classList.toggle("active", (tab==="login" && i===0)||(tab==="signup" && i===1));
  });
  hideAlert();
}

function showAlert(msg, type="error"){
  const box = document.getElementById("alertBox");
  box.textContent = msg;
  box.className = "alert " + type;
  box.style.display = "block";
}

function hideAlert(){
  document.getElementById("alertBox").style.display = "none";
}

function togglePw(id){
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

async function login(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  if(!email || !password){ showAlert("Please fill in all fields"); return; }
  const btn = document.getElementById("loginBtn");
  btn.textContent = "Signing in...";
  btn.disabled = true;
  hideAlert();
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    showAlert(error.message);
    btn.textContent = "Sign In";
    btn.disabled = false;
  } else {
    showAlert("Welcome back! Redirecting...", "success");
    setTimeout(()=>{ window.location.href = "app.html"; }, 1000);
  }
}

async function signup(){
  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const terms = document.getElementById("termsCheck").checked;
  if(!name){ showAlert("Please enter your full name"); return; }
  if(!email){ showAlert("Please enter your email"); return; }
  if(password.length < 8){ showAlert("Password must be at least 8 characters"); return; }
  if(!terms){ showAlert("Please accept the Terms of Service and Privacy Policy"); return; }
  const btn = document.getElementById("signupBtn");
  btn.textContent = "Creating account...";
  btn.disabled = true;
  hideAlert();
  const country = document.getElementById("signupCountry")?.value?.trim() || '';
  const lang = document.getElementById("signupLang")?.value || 'english';
  const { data: signupData, error } = await sb.auth.signUp({
    email, password,
    options: { data: { full_name: name, country, preferred_language: lang } }
  });
  if(!error && signupData?.user){
    await sb.from("profiles").upsert([{
      id: signupData.user.id,
      email,
      full_name: name,
      country,
      preferred_language: lang
    }]);
  }
  if(error){
    showAlert(error.message);
    btn.textContent = "Create Free Account";
    btn.disabled = false;
  } else {
    showAlert("Account created! Please check your email to confirm your account.", "success");
    btn.textContent = "Create Free Account";
    btn.disabled = false;
  }
}

async function googleLogin(){ showAlert("Google login coming soon. Please use email signup for now.", "success"); return; //
  const { error } = await sb.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo: window.location.origin + "/naturecore-ai/app.html" }
  });
  if(error) showAlert(error.message);
}

async function forgotPassword(){
  const email = document.getElementById("loginEmail").value.trim();
  if(!email){ showAlert("Enter your email address first"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + "/naturecore-ai/auth.html"
  });
  if(error){ showAlert(error.message); }
  else { showAlert("Password reset email sent! Check your inbox.", "success"); }
}

// Check if already logged in
sb.auth.getSession().then(({ data: { session } }) => {
  if(session) window.location.href = "app.html";
});
</script>
<div id="installBanner" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid #22c55e;border-radius:16px;padding:16px 20px;z-index:999;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.4);max-width:340px;width:90%;">
  <span style="font-size:24px;">🌿</span>
  <div style="flex:1;">
    <div style="font-weight:bold;font-size:14px;">Install Nature Core AI</div>
    <div style="color:#64748b;font-size:12px;">Add to home screen for quick access</div>
  </div>
  <button onclick="installPWA()" style="background:#22c55e;color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:bold;cursor:pointer;font-size:13px;">Install</button>
  <button onclick="dismissInstall()" style="background:none;border:none;color:#64748b;cursor:pointer;font-size:18px;">×</button>
</div>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/naturecore-ai/sw.js")
    .then(()=>console.log("SW registered"))
    .catch(e=>console.log("SW error",e));
}

// PWA install prompt
let deferredPrompt;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById("installBanner");
  if(banner) banner.style.display = "flex";
});

function installPWA(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{ deferredPrompt = null; });
    const banner = document.getElementById("installBanner");
    if(banner) banner.style.display = "none";
  }
}

function dismissInstall(){
  const banner = document.getElementById("installBanner");
  if(banner) banner.style.display = "none";
}
</script>
</body>
</html>
